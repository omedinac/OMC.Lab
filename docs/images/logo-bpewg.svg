  <text x="128" y="120" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-size="64" font-weight="700" letter-spacing="1" fill="#ffffff">BPE</text>
  <text x="128" y="176" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-size="64" font-weight="700" letter-spacing="1" fill="#ffffff">WG</text>
</svg>
